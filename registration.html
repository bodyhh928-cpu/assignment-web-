<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; }
  h1 { text-align: center; }
  table { margin: 0 auto; border-collapse: collapse; background: #fff; width: 100%; max-width: 620px; }
  td, th { border: 1px solid #888; padding: 8px 10px; }
  th { background: #e3e8ee; text-align: center; }
  td.label { width: 36%; font-weight: bold; background: #fafafa; }
  input[type=text], input[type=email], input[type=password], input[type=tel],
  input[type=number], input[type=date], select { width: 95%; padding: 5px; }
  textarea { width: 95%; padding: 5px; }
  .center { text-align: center; }
  .center button { padding: 6px 18px; margin: 0 6px; cursor: pointer; }
  small { color: #666; display: block; margin-top: 3px; }
</style>
</head>
<body>

<h1>Registration</h1>

<form action="Thankyou.html" method="get">
<!-- Hidden field -->
<input type="hidden" name="userId" value="1001">
<table>
  <tr><th colspan="2">Personal Data</th></tr>

  <tr>
    <td class="label"><label for="fname">First Name</label></td>
    <td><input type="text" id="fname" name="firstName" required
               pattern="[A-Za-z]+" title="Letters only (no spaces, numbers or symbols)">
    </td>
  </tr>
  <tr>
    <td class="label"><label for="lname">Last Name</label></td>
    <td><input type="text" id="lname" name="lastName" required
               pattern="[A-Za-z]+" title="Letters only (no spaces, numbers or symbols)">
    </td>
  </tr>
  <tr>
    <td class="label"><label for="email">Email</label></td>
    <td><input type="email" id="email" name="email" required placeholder="example@domain.com"
               pattern="[^@\s]+@[^@\s]+\.[A-Za-z]{2,}" title="Enter a valid email, e.g. name@example.com">
    </td>
  </tr>
  <tr>
    <td class="label"><label for="pass">Password</label></td>
    <td><input type="password" id="pass" name="password" required
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
               title="At least 8 characters with one uppercase letter, one lowercase letter, one number and one special character">
        <small>8+ chars, uppercase, lowercase, number, special character</small>
    </td>
  </tr>
  <tr>
    <td class="label"><label for="pass2">Repeat Password</label></td>
    <td><input type="password" id="pass2" name="repeatPassword" required
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
               title="At least 8 characters with one uppercase letter, one lowercase letter, one number and one special character">
    </td>
  </tr>
  <tr>
    <td class="label"><label for="pic">Upload Picture</label></td>
    <td><input type="file" id="pic" name="picture" accept="image/*"></td>
  </tr>
  <tr>
    <td class="label">Gender</td>
    <td>
      <label><input type="radio" name="gender" value="male" required> Male</label><br>
      <label><input type="radio" name="gender" value="female"> Female</label>
    </td>
  </tr>
  <tr>
    <td class="label"><label for="faculty">Faculty</label></td>
    <td>
      <select id="faculty" name="faculty" required>
        <option value="">-- Select faculty --</option>
        <option>Computer Science</option>
        <option>Software Engineering</option>
        <option>Information Systems</option>
        <option>Engineering</option>
        <option>Business</option>
      </select>
    </td>
  </tr>
  <tr>
    <td class="label"><label for="phone">Phone Number</label></td>
    <td><input type="tel" id="phone" name="phone" required placeholder="01012345678"
               pattern="01[0125][0-9]{8}" maxlength="11"
               title="Egyptian number: 11 digits starting with 010, 011, 012 or 015">
    </td>
  </tr>
  <tr>
    <td class="label"><label for="gpa">GPA</label></td>
    <td><input type="number" id="gpa" name="gpa" required min="0" max="4" step="0.1" placeholder="0.0 - 4.0">
        <small>Between 0.0 and 4.0, steps of 0.1</small>
    </td>
  </tr>
  <tr>
    <td class="label"><label for="dob">Date of Birth</label></td>
    <td><input type="date" id="dob" name="dob" required></td>
  </tr>

  <tr><th colspan="2">Interests</th></tr>
  <tr>
    <td><label><input type="checkbox" name="interests" value="programming"> Programming</label></td>
    <td><label><input type="checkbox" name="interests" value="dancing"> Dancing</label></td>
  </tr>
  <tr>
    <td><label><input type="checkbox" name="interests" value="reading"> Reading</label></td>
    <td><label><input type="checkbox" name="interests" value="football"> Playing Football</label></td>
  </tr>
  <tr>
    <td><label><input type="checkbox" name="interests" value="swimming"> Swimming</label></td>
    <td><label><input type="checkbox" name="interests" value="movies"> Movies</label></td>
  </tr>

  <tr><th colspan="2">About you</th></tr>
  <tr>
    <td colspan="2" class="center">
      <textarea name="about" rows="4" placeholder="Tell us about yourself..."></textarea>
    </td>
  </tr>

  <tr>
    <td colspan="2" class="center">
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </td>
  </tr>
  <tr>
    <td colspan="2" class="center">
      <input type="checkbox" id="agree" name="agree" required>
      <a href="terms.html" target="_blank">I agreed to the terms and conditions</a>
    </td>
  </tr>
</table>
</form>

</body>
</html>
